plugins {
    // Minecraft 26.x ships unobfuscated, so the non-remapping Loom plugin is used
    // and no mappings (Yarn) are needed — sources use Mojang's official names.
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu is optional: compiled against for the config-screen hook, and loaded in
    // the dev client, but not required by (or bundled into) the released jar.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// gradlew runClientGameTest: a test client that turns on every radar feature in a test
// world and takes screenshots (src/gametest). Not part of the released jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "minty_radar_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def gameTestRun = file('build/run/clientGameTest')
tasks.named('runClientGameTest') {
    // A small heap, so the test client still starts while your own game is open.
    jvmArgs '-Xmx2G'
    doFirst {
        // Tests run silently: master volume 0 in the test client's options.
        def options = new File(gameTestRun, 'options.txt')
        def lines = options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
        lines << 'soundCategory_master:0.0'
        options.parentFile.mkdirs()
        options.text = lines.join('\n') + '\n'

        // Start from a 1.2.0 settings file, to check it's moved to MintyRadar.json and
        // its range (64 blocks, index 2 of the old steps) carries over.
        def config = new File(gameTestRun, 'config')
        new File(config, 'MintyRadar.json').delete()
        config.mkdirs()
        new File(config, 'minty_radar.json').text = '{"enabled": true, "rangeIndex": 2, "friends": ["Notch"]}\n'
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
